name: CI
on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  # manual re-run path (flaky job, runner was offline, cache experiments)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # shared compiler cache: sccache (mounted from the runner VM) -> garage S3
  # on vm-runner-01; S3 endpoint+credentials come from the runner's env_file
  RUSTC_WRAPPER: /srv/cache/bin/sccache
  CARGO_INCREMENTAL: "0"
  # Cap build parallelism: cargo otherwise defaults to nproc (6 on
  # vm-runner-01) per job, against a lane capacity of 2.
  CARGO_BUILD_JOBS: "2"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo clippy --workspace --all-targets -- --deny warnings

  # Curated subset of the old ~37-combo sweep: the combos that broke most often.
  clippy-features:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--features tokio,channel,flow,parse"
          - "--features tokio,sigma,dns,http,tls"
          - "--features tokio,metrics,flow,monitor"
          # The rows above lint the lib only (adding --all-targets to them
          # needs `pcap`, which they deliberately omit). The three below carry
          # it because what they exist to cover lives in tests/ and examples/.
          #
          # aya + the XDP loader are otherwise compiled only by the docs job.
          - "--features tokio,af-xdp,xdp-loader --all-targets"
          # http2 is in no umbrella, so nothing else lints or tests it.
          - "--features tokio,http2 --all-targets"
          # The integration lane's exact set. Compiled nowhere else, so a plain
          # compile error under it could surface only as a red test-integration.
          - "--features integration-tests,tokio,channel,af-xdp --all-targets"
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: combos
          cache-targets: false
      - run: cargo clippy -p netring ${{ matrix.features }} -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      # No --skip for run_in_current_namespace any more: the test now guards on
      # the setns *outcome* (EPERM => skip) rather than on geteuid()==0, so it
      # is correct on an unprivileged runner, in a rootless container, and as
      # real root alike.
      - run: cargo test --workspace --features tokio,channel
      - name: sccache stats
        run: /srv/cache/bin/sccache --show-stats

  test-monitor-lib:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: monitor
          cache-targets: false
      - run: >
          cargo test -p netring --features
          "tokio,channel,flow,parse,pcap,http,http2,dns,tls,ja4plus,icmp,arp,ndp,lldp,cdp,asset,p0f,ad-protocols,asset-protocols,ssh,quic,ocsf-sink,sigma,infra-protocols,ftp,smtp,modbus,dnp3,stun,wireguard,nprint,yara"
          --lib

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: msrv
          cache-targets: false
      - run: cargo check --workspace --features tokio,channel

  miri:
    runs-on: ubuntu-24.04
    env:
      # miri intercepts rustc itself; sccache must stay out of the way
      RUSTC_WRAPPER: ""
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: miri
          cache-targets: false
      - name: Miri (key modules)
        env:
          MIRIFLAGS: -Zmiri-tree-borrows
        # --skip afpacket: the packet:: filter also matches afpacket::*,
        # whose tests hit FFI (if_nametoindex) that miri cannot execute.
        run: |
          cargo +nightly miri test -p netring --features tokio,channel --lib -- config:: --skip afpacket::
          cargo +nightly miri test -p netring --features tokio,channel --lib -- packet:: --skip afpacket::
          cargo +nightly miri test -p netring --features tokio,channel,monitor,flow,parse --lib -- monitor::dispatcher

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      # the docker cargo-deny action cannot see deny.toml -> install directly
      - uses: https://github.com/taiki-e/install-action@v2.87.7
        with:
          tool: cargo-deny
      - run: cargo deny check

  docs:
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
      - run: cargo doc --workspace --all-features --no-deps

  # §F of the 1.0 API-stability sweep (#37): regenerate the public-API snapshots
  # and fail on any diff, so every change to the public surface is a reviewed
  # change to public-api/*.txt. The job existed on GitHub and was lost in the
  # migration; public-api/README.md documented it the whole time.
  #
  # The nightly pin must satisfy the workspace MSRV — the previous pin
  # (nightly-2026-04-09, rustc 1.96) could not build the workspace at all after
  # the 1.97 bump. Bump it here and regenerate in the same commit.
  public-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-18
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: public-api
          cache-targets: false
      # Not via taiki-e/install-action: cargo-public-api is not in its tool
      # list, and an unsupported tool is an error rather than a fallback.
      # `cargo install` is what public-api/README.md documents anyway.
      - run: cargo install cargo-public-api --version 0.51.0 --locked
      - name: Regenerate and diff the public-API lock
        run: |
          cargo +nightly-2026-08-18 public-api -p netring \
            --all-features -ss > /tmp/netring.txt
          cargo +nightly-2026-08-18 public-api -p netring-exporters \
            --all-features -ss > /tmp/netring-exporters.txt
          # `diff` prints the change and exits non-zero, which is the report.
          diff -u public-api/netring.txt /tmp/netring.txt
          diff -u public-api/netring-exporters.txt /tmp/netring-exporters.txt
      - name: How to fix a failure here
        if: failure()
        run: |
          echo "The public API changed. If that was intentional, regenerate the"
          echo "snapshots and commit them alongside your change — see"
          echo "public-api/README.md. If it was not, fix the code, not the lock."

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7.0.1
      - uses: https://github.com/dtolnay/rust-toolchain@nightly
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: fuzz
          cache-targets: false
      - run: cargo install cargo-fuzz --locked
      # Blocking again since 2026-07-26: the expr_parse stack overflow
      # (unbounded parser recursion) is fixed by the MAX_DEPTH bound.
      - name: Fuzz smoke (60s per target)
        working-directory: netring
        run: |
          for t in bpf_matches bpf_builder expr_parse bpf_interp_raw ipnet_parse; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -timeout=30 -rss_limit_mb=4096
          done
