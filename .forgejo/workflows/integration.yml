name: Integration
# Runs on the privileged runner lane (label `integration`): jobs need
# CAP_NET_RAW/CAP_NET_ADMIN and preloaded kernel modules (see
# myserver docs/vm-runner.md). Kept separate from ci.yml so the main
# pipeline stays green if that runner is offline.
on:
  push:
    branches: [main, master]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  # manual re-run path (privileged runner was offline, flaky suite)
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Cap build parallelism, same as ci.yml: cargo otherwise defaults to nproc
  # (6 on vm-runner-01). This lane's job runs beside the standard lane's
  # three, in the same 10 GB VM.
  CARGO_BUILD_JOBS: "2"
  # Panics keep file:line, the build drops full DWARF. Full debug info made
  # each test job's target/ big enough that two concurrent zenkey runs
  # filled /srv/cache (2026-10-19). vm-dev builds with the same setting.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test-integration:
    runs-on: integration
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: integration
      - run: sudo apt-get update && sudo apt-get install -y jq libcap2-bin iproute2
      # This lane's failures have been undiagnosable from the outside: the tests
      # need privileges the runner may or may not actually have, and the
      # difference shows up only as a panic deep in the suite. Print the
      # privilege state up front so a red run explains itself.
      - name: Runner privilege state
        run: |
          echo "== id =="; id
          echo "== process capabilities =="; getpcaps $$ 2>&1 || true
          echo "== capsh =="; capsh --print 2>&1 | head -20 || true
          echo "== can we open AF_PACKET without setcap? =="
          python3 -c "import socket; socket.socket(socket.AF_PACKET, socket.SOCK_RAW, socket.htons(3)).close(); print('yes')" 2>&1 || true
          echo "== is CAP_NET_RAW in the bounding set? (setcap +ep is unusable if not) =="
          grep -E '^CapBnd' /proc/self/status || true
          echo "== netns =="; readlink /proc/self/ns/net || true
      # The feature set decides which privileged tests exist at all: with
      # only `integration-tests,tokio,channel,af-xdp` every live Monitor /
      # flow / multi-capture test (12 files) was compiled out, and two of
      # them had been broken for months unseen (#144). `xdp-loader` stays
      # out: it needs init-namespace CAP_BPF (see xdp-smoke below).
      # Logged like the test run below: a build that dies (the runner's OOM
      # killer surfaces as "signal 9") reports itself too.
      - name: Build test binaries
        run: |
          set -o pipefail
          cargo test -p netring --features "integration-tests,tokio,channel,af-xdp,flow,parse,pcap,http,icmp" \
            --no-run 2>&1 | tee integration-build.log
      - name: Run capability tests
        run: |
          for bin in $(cargo test -p netring --features "integration-tests,tokio,channel,af-xdp,flow,parse,pcap,http,icmp" \
                       --no-run --message-format=json 2>/dev/null \
                       | jq -r 'select(.profile.test == true) | .executable' | sort -u); do
            sudo setcap cap_net_raw,cap_net_admin+ep "$bin"
          done
          # --no-fail-fast so one failing binary does not mask the rest: this
          # lane has had multiple independent failures at once, and stopping at
          # the first turns a two-bug run into two more red runs.
          # The job log is not retrievable from outside this Forgejo, so the
          # run keeps its own output for the failure report below.
          set -o pipefail
          cargo test -p netring --features "integration-tests,tokio,channel,af-xdp,flow,parse,pcap,http,icmp" \
            --no-fail-fast -- --test-threads=1 --nocapture 2>&1 | tee integration-test.log
      # Neither job logs nor artifacts can be fetched from outside this
      # Forgejo with an API token, so on failure the run reports the failing
      # sections itself: a comment on the pull request, or a new issue for a
      # push or a manual run. A red master push used to say nothing at all
      # (02f0367, 2026-10-21).
      - name: Report the failing tests
        if: failure()
        env:
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          log=integration-test.log
          [ -f "$log" ] || log=integration-build.log
          if [ ! -f "$log" ]; then
            log=no-log.txt
            echo "The job failed before the build step (checkout, toolchain, cache or apt)." > "$log"
          fi
          {
            echo "### \`test-integration\` failed on \`${SHA:0:8}\` (${EVENT}, \`${REF}\`)"
            echo
            echo '```'
            grep -E "^test .* FAILED$|^failures:$|^---- |panicked at|^error(\[E[0-9]+\])?:|^thread .* panicked|signal 9" -A 14 "$log" | head -400
            echo '```'
            echo
            echo "<details><summary>last 120 lines of $log</summary>"
            echo
            echo '```'
            tail -120 "$log"
            echo '```'
            echo '</details>'
          } > comment.md
          python3 - <<'EOF'
          import json, os, urllib.request
          env = os.environ
          body = open('comment.md').read()
          if env['EVENT'] == 'pull_request':
              url = f"{env['API']}/repos/{env['REPO']}/issues/{env['PR']}/comments"
              payload = {"body": body}
          else:
              url = f"{env['API']}/repos/{env['REPO']}/issues"
              payload = {"title": f"test-integration failed on {env['REF']} at {env['SHA'][:8]}", "body": body}
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), method="POST",
              headers={"Authorization": "token " + env['TOKEN'], "Content-Type": "application/json"})
          with urllib.request.urlopen(req) as r:
              print("report posted:", r.status)
          EOF

  # INFORMATIONAL: bpf(BPF_MAP_CREATE) requires init-namespace CAP_BPF, which
  # rootless podman cannot grant (and enabling unprivileged BPF on the
  # untrusted CI VM is a deliberate non-option). AF_XDP suites must run on a
  # real-root machine: cargo test --features integration-tests,af-xdp,...
  xdp-smoke:
    runs-on: integration
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v7
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2.9.2
        with:
          key: xdp
      - run: sudo apt-get update && sudo apt-get install -y jq
      - name: XDP loopback smoke
        continue-on-error: true
        run: |
          cargo test -p netring --features "integration-tests,af-xdp,xdp-loader,flow,tokio,monitor" --test xdp_lo_smoke --no-run
          bin=$(cargo test -p netring --features "integration-tests,af-xdp,xdp-loader,flow,tokio,monitor" \
              --test xdp_lo_smoke --no-run --message-format=json 2>/dev/null \
              | jq -r 'select(.profile.test == true) | .executable')
          sudo "$bin" --nocapture --test-threads=1
