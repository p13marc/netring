# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # The wasmtime ignores (RUSTSEC-2026-0222/0269/0316/0327/0359/0362/0363)
    # were dropped 2026-10-24: yara-x 1.22 requires wasmtime ^48.0.6, and
    # 48.0.7 is past every one of those fixes and RUSTSEC-2026-0379's.
    # bincode is unmaintained; pulled in by yara-x (same opt-in `yara`
    # feature). No replacement available upstream — re-check on yara-x
    # upgrades.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained bincode via yara-x; no upstream fix" },
    # RUSTSEC-2024-0436 (unmaintained `paste` via parquet) was dropped
    # 2026-09-02: arrow/parquet 59.2 no longer pull it, and cargo-deny
    # reports an unmatched ignore as a warning.
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # Permissive; OSI-approved. Used by `xxhash-rust` (our content
    # hash for dedup).
    "BSL-1.0",
    # Community Data License Agreement – Permissive 2.0. Permissive; used by
    # `webpki-roots` (the Mozilla CA bundle) pulled in via `ureq`'s TLS stack
    # in the `netring-exporters` OTLP sink.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
