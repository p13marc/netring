# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # Two wasmtime advisories, both pulled in by yara-x for compiled-rule
    # execution, behind netring's opt-in `yara` feature. Re-checked
    # 2026-09-02 against yara-x 1.20.0 (the latest), which requires
    # wasmtime ^45.0.3 — the 1.18 → 1.20 bump moved us from wasmtime 43 to
    # 45, but no fixed version is reachable through any published yara-x:
    #   RUSTSEC-2026-0222 fixed in 24.0.12 / 36.0.13 / 46.0.2 / 47.0.3
    #   RUSTSEC-2026-0269 fixed in 24.0.13 / 36.0.14 / 46.0.3 / 47.0.4
    # 45.x is outside every one of those ranges. Re-check on yara-x upgrades.
    { id = "RUSTSEC-2026-0222", reason = "no reachable fixed wasmtime through yara-x; yara feature is opt-in" },
    { id = "RUSTSEC-2026-0269", reason = "no reachable fixed wasmtime through yara-x; yara feature is opt-in" },
    # bincode is unmaintained; pulled in by yara-x (same opt-in `yara`
    # feature). No replacement available upstream — re-check on yara-x
    # upgrades.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained bincode via yara-x; no upstream fix" },
    # RUSTSEC-2024-0436 (unmaintained `paste` via parquet) was dropped
    # 2026-09-02: arrow/parquet 59.2 no longer pull it, and cargo-deny
    # reports an unmatched ignore as a warning.
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # Permissive; OSI-approved. Used by `xxhash-rust` (our content
    # hash for dedup).
    "BSL-1.0",
    # Community Data License Agreement – Permissive 2.0. Permissive; used by
    # `webpki-roots` (the Mozilla CA bundle) pulled in via `ureq`'s TLS stack
    # in the `netring-exporters` OTLP sink.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
