# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # wasmtime (pulled in by yara-x for compiled-rule execution, behind
    # netring's opt-in `yara` feature). No fixed version is reachable:
    # the fixes land in 24.0.12 / 36.0.13 / 46.0.2 / 47.0.3, while
    # yara-x 1.18 requires ^43 and even the latest yara-x (1.20) requires
    # ^45 — both outside every fixed range. Re-check on yara-x upgrades.
    { id = "RUSTSEC-2026-0222", reason = "no reachable fixed wasmtime through yara-x; yara feature is opt-in" },
    # bincode is unmaintained; pulled in by yara-x (same opt-in `yara`
    # feature). No replacement available upstream — re-check on yara-x
    # upgrades.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained bincode via yara-x; no upstream fix" },
    # paste is unmaintained; pulled in by parquet 59 (netring-exporters'
    # opt-in `parquet` feature). Goes away when arrow/parquet drop it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained paste via parquet; no upstream fix" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    # Permissive; OSI-approved. Used by `xxhash-rust` (our content
    # hash for dedup).
    "BSL-1.0",
    # Community Data License Agreement – Permissive 2.0. Permissive; used by
    # `webpki-roots` (the Mozilla CA bundle) pulled in via `ureq`'s TLS stack
    # in the `netring-exporters` OTLP sink.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
